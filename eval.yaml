version: "1"

# Eval suite for evroc-compute (pilot).
# Run from the repo root so skillgrade auto-detects ALL skills under skills/*
# (needed for negative-trigger cases, where the agent must pick the correct
# non-compute skill among all six). The mock `evroc` CLI shim must be on PATH —
# use run-eval.sh which prepends tests/bin to PATH.

defaults:
  agent: opencode
  provider: local
  trials: 5
  timeout: 300
  threshold: 0.8
  docker:
    base: node:20-slim
  environment:
    cpus: 2
    memory_mb: 2048

tasks:
  # ---- trigger: compute should be the only resource service used ----
  - name: should-trigger-vm-create
    instruction: |
      Use the evroc CLI to complete this task. Run the actual commands. For any config you need, run `evroc config show` — do not read ~/.evroc/config.yaml directly.
      Create a new evroc VM named web-server in zone a with the a1a.m flavor.
    graders:
      - type: deterministic
        run: python3 /Users/kspace/Developer/test-runs/evroc-skills/graders/check.py should-trigger-vm-create
        weight: 1.0

  - name: should-trigger-disk-create
    instruction: |
      Use the evroc CLI to complete this task. Run the actual commands. For any config you need, run `evroc config show` — do not read ~/.evroc/config.yaml directly.
      I need to make an evroc boot disk from ubuntu-minimal.24-04.1.
    graders:
      - type: deterministic
        run: python3 /Users/kspace/Developer/test-runs/evroc-skills/graders/check.py should-trigger-disk-create
        weight: 1.0

  - name: should-trigger-snapshot
    instruction: |
      Use the evroc CLI to complete this task. Run the actual commands. For any config you need, run `evroc config show` — do not read ~/.evroc/config.yaml directly.
      Take a snapshot of my evroc disk called db-backup.
    workspace:
      - src: fixtures/seed/disk-db-backup
        dest: .evroc-state/disk/db-backup
    graders:
      - type: deterministic
        run: python3 /Users/kspace/Developer/test-runs/evroc-skills/graders/check.py should-trigger-snapshot
        weight: 1.0

