## template: jinja
#cloud-config
# SPDX-License-Identifier: Apache-2.0
# Rancher server node — installs K3s, cert-manager, and Rancher
hostname: ${hostname}

ssh_pwauth: false
users:
  - name: ubuntu
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
{% if public_ssh_keys %}
    ssh_authorized_keys:
{% for pubkey in public_ssh_keys %}
      - {{ pubkey }}
{% endfor %}
{% endif %}

package_update: true

packages:
  - curl

write_files:
  - path: /etc/rancher/k3s/config.yaml
    content: |
      tls-san:
        - ${rancher_hostname}

runcmd:
  # Install K3s (single-node Kubernetes with embedded etcd) with shared token
  - curl -sfL https://get.k3s.io ${k3s_version != "" ? "INSTALL_K3S_VERSION=\"${k3s_version}\"" : ""} | sh -s - server --cluster-init --tls-san "${rancher_hostname}" --write-kubeconfig-mode "0644" --token "${k3s_token}"

  # Wait for K3s to be ready
  - until sudo k3s kubectl get nodes; do echo "Waiting for K3s..."; sleep 5; done

  # Install Helm
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  # Install cert-manager CRDs
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.0/cert-manager.crds.yaml

  # Install cert-manager via Helm
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo add jetstack https://charts.jetstack.io
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo update
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace

  # Wait for cert-manager to be ready
  - until sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n cert-manager rollout status deploy/cert-manager; do echo "Waiting for cert-manager..."; sleep 5; done

  # Install Rancher (community Helm chart — free, no SCC needed)
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo update
  - sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm install rancher rancher-stable/rancher --namespace cattle-system --create-namespace --set hostname="${rancher_hostname}" --set replicas=1 --set bootstrapPassword="${rancher_password}"

  # Wait for Rancher to be ready
  - until sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n cattle-system rollout status deploy/rancher; do echo "Waiting for Rancher..."; sleep 10; done

final_message: "Rancher server ready after $UPTIME seconds"
